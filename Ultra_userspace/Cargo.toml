cargo-features = ["trim-paths"]

[workspace]
members = [
    "userland",
    "services/director",
    "services/input",
    # `medida/` no es `services/`: un servicio lo reclama alguien y vive
    # mientras dure la sesion. Esto se ejecuta, contesta un numero y se muere.
    "medida/coste",
    # S5 del SOMBREADOR: SPIR-V traducido aqui dentro, SELLADO y ejecutado.
    "medida/sombra",
]
resolver = "2"

[profile.release]
trim-paths = "all"
panic = "abort"
lto = true
codegen-units = 1

# ** LA 3060 A opt-level = 3, DICHO Y VIGILADO (2026-09-25). Ya lo era por el
# perfil de arriba; ahora es una linea con nombre, porque el propietario lo
# pidio como REGLA y el guardian `la-3060` exige que siga aqui. Aplica al
# codigo de la CPU que habla con la 3060 (recetas, empujes, comprobaciones):
# lo que corre DENTRO de la 3060 son sus sombreadores, ya en codigo maquina.
[profile.release.package."bmo-gpu-ga10x"]
opt-level = 3
