<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- ECCE: la hoja con sus renglones y la pluma de oro, en diagonal -->
  <defs>
    <linearGradient id="papel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF8F1"/>
      <stop offset="1" stop-color="#DDD6C6"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F7D98A"/>
      <stop offset="0.55" stop-color="#D8A657"/>
      <stop offset="1" stop-color="#9C6A22"/>
    </linearGradient>
  </defs>
  <!-- la sombra, blanda -->
  <rect x="5.5" y="4" width="18" height="25" rx="3" fill="#000" opacity="0.22"/>
  <!-- la hoja -->
  <rect x="4.5" y="2.5" width="18" height="25" rx="3" fill="url(#papel)" stroke="#2A2F38" stroke-opacity="0.35" stroke-width="0.8"/>
  <!-- los renglones -->
  <g stroke="#7A8494" stroke-width="1.3" fill="none">
    <line x1="8" y1="8.5" x2="18.5" y2="8.5"/>
    <line x1="8" y1="12.5" x2="18.5" y2="12.5"/>
    <line x1="8" y1="16.5" x2="16" y2="16.5"/>
    <line x1="8" y1="20.5" x2="13" y2="20.5"/>
  </g>
  <!-- la pluma -->
  <g transform="translate(-1 1.5) rotate(38 22 16)">
    <rect x="23" y="17.5" width="5" height="1.5" fill="#000" opacity="0.18"/>
    <rect x="19.5" y="3" width="5" height="16.5" rx="1.6" fill="url(#oro)" stroke="#5A3A0E" stroke-width="0.6"/>
    <rect x="19.5" y="6.2" width="5" height="1.6" fill="#6E4A16"/>
    <path d="M19.8 19.5 L24.2 19.5 L22 25.5 Z" fill="#3B2A12"/>
    <path d="M21.6 19.5 L22.4 19.5 L22 23.5 Z" fill="#E8C47A"/>
  </g>
</svg>
