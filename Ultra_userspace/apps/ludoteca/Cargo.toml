[package]
name = "bmo-app-ludoteca"
version = "0.1.0"
edition = "2021"
description = "LUDOTECA (F4): tus juegos de todas las tiendas, con el armazon de una comunidad y una animacion propia por tienda. J1 de PLAN_LA_LUDOTECA."

[[bin]]
name = "ludoteca"
path = "src/main.rs"

[dependencies]
# El monton (03-10): la lista de libres sobre UN bloque, con su handle
# (`bmo_monton::Region`). Puro: Ring 3 lo enlaza (L8).
bmo-monton = { path = "../../../platform/shared/bmo-monton" }
bmo-userland = { path = "../../userland" }
# Las lineas JUEGO / FICHERO / MOTOR y el camino de cada juego (J0).
bmo-ludoteca = { path = "../../../platform/shared/bmo-ludoteca" }
# El mismo rasterizador que el kernel, el escritorio y el TALLER.
bmo-dibujo = { path = "../../../platform/shared/bmo-dibujo" }
# LA LETRA DE LA CASA (04-10): la de las maquetas, la misma que HERMES. Con
# monton, por eso el paquete `bmo-letra-monton` (ver el Cargo.toml de HERMES).
bmo-letra = { package = "bmo-letra-monton", path = "../../../platform/shared/bmo-letra-monton" }
# HM6: si hay escritorio de mision lo dice `sys/director.cfg`, con la misma
# regla que lee el escritorio.
bmo-config = { path = "../../../platform/shared/bmo-config" }
