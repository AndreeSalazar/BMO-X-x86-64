[package]
name = "bmo-app-proton-x"
version = "0.1.0"
edition = "2021"
description = "PROTON-X P1c: carga un .exe x86-64 de Windows en Ring 3 de BMO-X, sella su codigo y le da el kernel32 de la casa"

[[bin]]
name = "proton-x"
path = "src/main.rs"

[dependencies]
# El monton (03-10): la lista de libres sobre UN bloque, con su handle
# (`bmo_monton::Region`). Puro: Ring 3 lo enlaza (L8).
bmo-monton = { path = "../../../platform/shared/bmo-monton" }
bmo-userland = { path = "../../userland" }
# El cargador es puro y se prueba en el anfitrion, donde `hola.exe` CORRE
# (`tests/corre.rs` de alli). Aqui se pone lo que el no sabe: la memoria de
# verdad, el sellado, la tabla de la casa y el salto.
bmo-proton-x = { path = "../../../platform/shared/proton-x" }
# Las DLL de la casa (kernel32, user32, gdi32): las mismas que corre el banco
# del anfitrion. Aqui se les pone la plataforma de BMO-X (`src/plataforma.rs`).
bmo-proton-x-casa = { path = "../../../platform/shared/proton-x-casa" }
# La fecha de la placa (P4f2: GetSystemTimeAsFileTime). Puro, como en el DIRECTOR.
bmo-rtc = { path = "../../../platform/drivers/rtc" }
# P3b4c: el lote a la PUERTA de la 3060 (la receta VRN2; puro: la llamada la
# hace `src/la3060.rs`).
bmo-proton-x-sm86 = { path = "../../../platform/shared/proton-x-sm86" }
# 05-10: la letra de la casa, para el CARTEL ROJO de los avisos (`src/cartel.rs`).
bmo-letra = { path = "../../../platform/shared/bmo-letra" }
