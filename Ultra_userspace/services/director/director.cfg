# director.cfg -- el aspecto del escritorio de BMO-X
#
# Se lee UNA vez, al arrancar. Lo que no se entienda sale en la consola de
# Ejecutar con su numero de linea, y esa clave se queda como estaba: un fichero
# mal escrito no deja el escritorio sin arrancar.
#
# Colores como #RRGGBB. Interruptores como si / no.
#
# [!] Este fichero lo copia el build a sys/ en cada despliegue. Si lo cambias en
# A:\sys\ directamente, el siguiente despliegue lo pisa: el de verdad esta en el
# repo, en Ultra_userspace/services/director/director.cfg.

# -- El fondo del escritorio (un degradado de arriba a abajo)
fondo_arriba   = #161236       # la noche de la ciudad del gato
fondo_abajo    = #06050C

# -- Una FOTO de fondo (BICO, BMP o QOI), escalada para cubrir la pantalla. Tapa
#    lo de abajo (el degradado o el de mision); `no` lo devuelve. El build hace
#    sys/fondo.qoi con la ciudad del gato (activos/fondo/ciudad.webp,
#    toolchain/tools/fondo/): para volver a ella, `fondo_imagen = sys/fondo.qoi`.
fondo_imagen   = no

# -- Lo de detras sin foto (06-10):
#      mision     el ESCRITORIO DE MISION: el cielo con su rejilla, la estrella
#                 gato (SOL DE PLASMA, quieta: la CPU la pinta UNA vez) y su
#                 planeta. El puntero es la reticula de la nave
#      degradado  el de `fondo_arriba` a `fondo_abajo`, el de siempre
#    Tambien se cambia en vivo con `aspecto` en Ejecutar.
fondo          = mision

# -- El acento: lo usan TODAS las ventanas (titulos, seleccion, Ejecutar) y el panel.
#    Es el OJO DEL GATO, medido sobre el logo de BMO-X.
acento         = #5EF2E6

# -- El panel de la izquierda (era la barra de arriba): negro, con pelo violeta
barra_fondo    = #09080F
barra_borde    = #2B2250
barra_flotante = si        # si = pastilla separada del borde; no = la de siempre
barra_hueco    = 6         # pixeles de hueco, de 0 a 12

# -- Los instrumentos del panel (el pulso y el sonido no se apagan)
cpu            = si        # la parte del ultimo segundo que el nucleo no durmio
memoria        = si
vatios         = si        # el paquete entero, medido por el kernel
reloj          = si

# -- El vestido de las ventanas. Los dos los pidio el propietario:
#      fino     (04-10) "elegancia, la de Francia": barra lisa, un filete del
#               acento que se apaga en los extremos, botones redondos, sin neon
#      hacker   (25-09) "estilo hacker futurista": scanlines, esquinas HUD,
#               segmentos, y el borde de neon que corre alrededor del foco
#    Tambien se cambia en vivo con `aspecto` en Ejecutar.
marco          = fino
