<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" width="1000" height="900" style="background:#000" role="img" aria-label="BMO-X: el gato con los ojos de neon">
<style>
.bx-trazo{stroke:#F2F7F9;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.bx-fino{stroke:#F2F7F9;stroke-width:2.2;stroke-linecap:round;fill:none}
.bx-ojos{animation:bx-brillo 2.6s ease-in-out infinite}
.bx-parpado{transform-box:fill-box;transform-origin:center;animation:bx-parpadeo 6s infinite}
.bx-g1{animation:bx-glitch1 3.7s steps(1) infinite}
.bx-g2{animation:bx-glitch2 3.7s steps(1) infinite}
.bx-corte{animation:bx-corte 5.3s steps(1) infinite}
.bx-cola{transform-box:fill-box;transform-origin:100% 20%;animation:bx-cola 4s ease-in-out infinite}
.bx-escaneo{animation:bx-escaneo 3.2s linear infinite}
.bx-aviso{animation:bx-aviso 1.6s ease-in-out infinite}
.bx-kanji{animation:bx-kanji 7s steps(1) infinite}
@keyframes bx-brillo{0%,100%{opacity:1}50%{opacity:.78}}
@keyframes bx-parpadeo{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.12)}}
@keyframes bx-glitch1{0%,82%,100%{transform:translate(0,0);opacity:0}84%{transform:translate(-9px,1px);opacity:.95}87%{transform:translate(6px,-2px);opacity:.95}90%{transform:translate(-3px,0);opacity:.7}93%{transform:translate(12px,0);opacity:.5}}
@keyframes bx-glitch2{0%,82%,100%{transform:translate(0,0);opacity:0}85%{transform:translate(9px,-1px);opacity:.95}88%{transform:translate(-6px,2px);opacity:.95}91%{transform:translate(4px,0);opacity:.7}94%{transform:translate(-12px,0);opacity:.5}}
@keyframes bx-corte{0%,88%,100%{transform:translateX(0);opacity:0}89%{transform:translateX(-14px);opacity:1}91%{transform:translateX(10px);opacity:1}93%{transform:translateX(-5px);opacity:1}95%{opacity:0}}
@keyframes bx-cola{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-6deg)}}
@keyframes bx-escaneo{0%{transform:translateY(0);opacity:0}8%{opacity:.55}92%{opacity:.55}100%{transform:translateY(560px);opacity:0}}
@keyframes bx-aviso{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes bx-kanji{0%,90%,100%{transform:translate(0,0)}92%{transform:translate(4px,0)}94%{transform:translate(-3px,0)}}
@media (prefers-reduced-motion: reduce){.bx-ojos,.bx-parpado,.bx-g1,.bx-g2,.bx-corte,.bx-cola,.bx-escaneo,.bx-aviso,.bx-kanji{animation:none}}
</style>
<rect x="0" y="0" width="1000" height="900" fill="#000"/>
<g transform="translate(60 0)"><defs>
<filter id="bx-neon" x="-50%" y="-200%" width="200%" height="500%">
<feGaussianBlur stdDeviation="6" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="bx-halo" x="-20%" y="-20%" width="140%" height="140%">
<feGaussianBlur stdDeviation="3"/>
</filter>
<clipPath id="bx-franja"><rect x="70" y="300" width="340" height="26"/><rect x="70" y="470" width="340" height="14"/></clipPath>
<clipPath id="bx-caja"><rect x="70" y="80" width="340" height="510"/></clipPath>
<linearGradient id="bx-luz" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#5EF2E6" stop-opacity="0"/>
<stop offset=".5" stop-color="#5EF2E6" stop-opacity=".9"/>
<stop offset="1" stop-color="#5EF2E6" stop-opacity="0"/>
</linearGradient>
</defs>
<ellipse cx="250" cy="580" rx="200" ry="14" fill="#5EF2E6" opacity=".10"/>
<g opacity=".35" filter="url(#bx-halo)">
<path d="M205 92 L248 150 Q290 136 334 150 L360 116 L380 128 L373 161 Q399 200 389 241 C386 276 374 298 375 322 C378 352 390 402 387 452 C384 510 381 550 360 570 L346 572 Q333 582 320 572 L304 572 Q291 582 278 572 L246 572 C210 573 172 556 166 516 C160 472 178 422 204 388 C224 362 244 336 252 313 Q201 286 193 236 Q186 201 199 172 Z" fill="none" stroke="#5EF2E6" stroke-width="6"/>
</g>
<path class="bx-cola bx-trazo" d="M204 571 C178 577 148 575 136 562 C124 548 130 527 149 527 C168 527 175 552 158 566 C138 580 98 578 74 570 C46 561 32 537 42 517 C52 498 80 497 92 513 C104 529 92 549 72 548" fill="none"/>
<path class="bx-trazo" d="M205 92 L248 150 Q290 136 334 150 L360 116 L380 128 L373 161 Q399 200 389 241 C386 276 374 298 375 322 C378 352 390 402 387 452 C384 510 381 550 360 570 L346 572 Q333 582 320 572 L304 572 Q291 582 278 572 L246 572 C210 573 172 556 166 516 C160 472 178 422 204 388 C224 362 244 336 252 313 Q201 286 193 236 Q186 201 199 172 Z" fill="#040607"/>
<path class="bx-fino" d="M306 448 C302 502 299 542 301 571"/>
<g transform="translate(262 404)">
<path d="M0 -14 L14 10 L-14 10 Z" fill="none" stroke="#5EF2E6" stroke-width="2.4" stroke-linejoin="round" class="bx-aviso"/>
<path d="M0 -6 V2 M0 6 V6.5" stroke="#5EF2E6" stroke-width="2.4" stroke-linecap="round" class="bx-aviso"/>
<text x="22" y="6" font-family="Michroma, Orbitron, 'Segoe UI', sans-serif" font-size="13" fill="#5EF2E6" letter-spacing="2">BMO-X</text>
</g>
<path class="bx-fino" d="M232 252 L176 244 M232 260 L174 262 M232 268 L180 280 M342 252 L398 244 M342 260 L400 262 M342 268 L394 280" opacity=".85"/>
<path d="M282 268 L287 274 L292 268" fill="none" stroke="#F2F7F9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<g filter="url(#bx-neon)" class="bx-ojos"><g class=""><g class="bx-parpado"><rect x="228" y="226" width="44" height="8" rx="4" fill="#5EF2E6"/><rect x="228" y="242" width="44" height="8" rx="4" fill="#5EF2E6"/><rect x="303" y="226" width="44" height="8" rx="4" fill="#5EF2E6"/><rect x="303" y="242" width="44" height="8" rx="4" fill="#5EF2E6"/></g></g></g>
<g style="mix-blend-mode:screen"><g class="bx-g1"><g class="bx-parpado"><rect x="228" y="226" width="44" height="8" rx="4" fill="#FF2E88"/><rect x="228" y="242" width="44" height="8" rx="4" fill="#FF2E88"/><rect x="303" y="226" width="44" height="8" rx="4" fill="#FF2E88"/><rect x="303" y="242" width="44" height="8" rx="4" fill="#FF2E88"/></g></g><g class="bx-g2"><g class="bx-parpado"><rect x="228" y="226" width="44" height="8" rx="4" fill="#3DA5FF"/><rect x="228" y="242" width="44" height="8" rx="4" fill="#3DA5FF"/><rect x="303" y="226" width="44" height="8" rx="4" fill="#3DA5FF"/><rect x="303" y="242" width="44" height="8" rx="4" fill="#3DA5FF"/></g></g></g>
<g class="bx-corte" clip-path="url(#bx-franja)">
<path d="M205 92 L248 150 Q290 136 334 150 L360 116 L380 128 L373 161 Q399 200 389 241 C386 276 374 298 375 322 C378 352 390 402 387 452 C384 510 381 550 360 570 L346 572 Q333 582 320 572 L304 572 Q291 582 278 572 L246 572 C210 573 172 556 166 516 C160 472 178 422 204 388 C224 362 244 336 252 313 Q201 286 193 236 Q186 201 199 172 Z" fill="none" stroke="#FF2E88" stroke-width="4"/>
<path d="M204 571 C178 577 148 575 136 562 C124 548 130 527 149 527 C168 527 175 552 158 566 C138 580 98 578 74 570 C46 561 32 537 42 517 C52 498 80 497 92 513 C104 529 92 549 72 548" fill="none" stroke="#5EF2E6" stroke-width="4"/>
</g>
<g clip-path="url(#bx-caja)"><rect class="bx-escaneo" x="90" y="70" width="330" height="10" fill="url(#bx-luz)"/></g></g>
<g class="bx-kanji" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="170" fill="#5EF2E6">
<text x="560" y="575" filter="url(#bx-neon)" opacity=".55">&#x732B;</text>
<text x="560" y="575">&#x732B;</text>
</g>
<g font-family="Michroma, Orbitron, 'Segoe UI', sans-serif">
<text x="480" y="745" text-anchor="middle" font-size="104" fill="#F2F7F9" letter-spacing="10">BMO-X</text>
<g transform="translate(788 690)" class="bx-aviso">
<path d="M0 -26 L26 18 L-26 18 Z" fill="none" stroke="#5EF2E6" stroke-width="4" stroke-linejoin="round"/>
<path d="M0 -10 V5 M0 11 V11.5" stroke="#5EF2E6" stroke-width="4" stroke-linecap="round"/>
</g>
<line x1="200" y1="812" x2="300" y2="812" stroke="#5EF2E6" stroke-width="2" opacity=".6"/>
<line x1="700" y1="812" x2="800" y2="812" stroke="#5EF2E6" stroke-width="2" opacity=".6"/>
<text x="500" y="820" text-anchor="middle" font-size="24" fill="#5EF2E6" letter-spacing="9">BMO METAKERNEL</text>
</g>
</svg>
