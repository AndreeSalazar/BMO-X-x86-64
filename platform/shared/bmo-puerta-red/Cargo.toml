[package]
name = "bmo-puerta-red"
version = "0.1.0"
edition = "2021"
description = "El GATE RED: la puerta que se paga una vez, el buzon sin syscalls y el radar de 4 ms. Politica pura, probada en el anfitrion."
license = "Apache-2.0"

# Solo el censo de las laminas (`bmo-lamina`, puro: A3, 14-10). Lo enlazan el
# kernel (que lo JUZGA) y Ring 3 (que lo USA), y L8 no deja que Ring 3 enlace
# `bmo-net`, que es un driver.
[dependencies]
bmo-lamina = { path = "../bmo-lamina" }

# Only for the hostile tests: nothing that runs on the machine links it.
[dev-dependencies]
bmo-hostile = { path = "../bmo-hostile" }
