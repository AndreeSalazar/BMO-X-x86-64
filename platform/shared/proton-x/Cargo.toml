[package]
name = "bmo-proton-x"
version = "0.1.0"
edition = "2021"
description = "PROTON-X, el cargador: lee un .exe x86-64 de Windows, lo coloca en memoria, aplica sus relocalizaciones y resuelve sus importaciones contra la tabla de la casa. Puro."
license = "Apache-2.0"

# Sin dependencias: bytes que entran, bytes que salen. Quien cargue de verdad
# (la app de Ring 3) pone la memoria, el sellado y el salto.
[dependencies]

# Solo para el banco: el cubo de X1 (sus cuentas y las huellas de la 3060) es
# la verdad contra la que se mide el interprete de DXIL y el rasterizador.
[dev-dependencies]
bmo-cubo = { path = "../bmo-cubo" }

[lib]
name = "bmo_proton_x"
