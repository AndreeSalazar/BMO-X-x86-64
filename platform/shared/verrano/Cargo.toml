[package]
name = "bmo-verrano"
version = "0.1.0"
edition = "2021"
description = "VERRANO, la API de dibujo de BMO-X (V0): un fotograma de vertices, y los backends que lo dibujan -- la CPU (el juez) y la 3060. Puro."
license = "Apache-2.0"

# Sin dependencias: la API y el backend CPU son aritmetica sobre buferes que
# da quien llama. El backend de la 3060 vive donde se toca la tarjeta. La
# unica, opcional: PROMETEO, para que el Programa de la casa sea una etapa.
[features]
# V3a: el Programa de la casa (PROMETEO) como etapa de la tuberia. Lo
# enciende quien dibuja con programas; el driver de la 3060 no lo necesita.
prometeo = ["dep:bmo-prometeo"]

[dependencies]
bmo-prometeo = { path = "../prometeo", optional = true }

[dev-dependencies]
bmo-cubo = { path = "../bmo-cubo" }
bmo-prometeo = { path = "../prometeo" }
bmo-proton-x = { path = "../proton-x" }

[lib]
name = "bmo_verrano"
