[package]
name = "bmo-cobol-front"
version = "0.1.0"
edition = "2021"
authors = ["BMO Project"]
description = "BMO COBOL: el FRONTEND (lexer, parser, arbol, PICTURE, registros). No nombra una maquina."

# ** SIN dependencias (2026-09-18). El frontend no sabe de CPU, ni de BEF, ni
# del gate, ni de los numeros de la puerta: todo eso es de quien EMITE, en
# `emisor-x86_64/`. El guardian `isa` lo vigila.
[dependencies]

# NOTA: gnucobol-rs (GPL) ELIMINADO -- la PIC la parsea nuestro propio
# src/pic.rs, y el submodulo `extern/gnucobol-rs` ya no existe (03-10: la regla
# del propietario, "no integrar objetos terceros, la inspiracion de Grace
# Hopper"). COBOL 100% BMO.

[lib]
name = "bmo_cobol_front"
path = "src/lib.rs"
