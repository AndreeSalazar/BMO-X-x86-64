[package]
name = "bmo-bsf"
version = "0.1.0"
edition = "2021"
authors = ["BMO Project"]
description = "BSF, BMO Format Shader: SPIR-V + su interfaz + el codigo ya traducido, en un sobre que la GPU valida antes de ejecutar (S6)."

# `no_std` sin `alloc`, como el frontend: el MISMO lector corre en el
# anfitrion (quien fabrica el BSF) y dentro de una app de BMO-X (quien lo
# consume). El frontend esta porque la capa PROFUNDA relee el SPIR-V (la
# entrada comun de todos) para ver que la tabla no miente.
#
# ** Y NINGUN EMISOR (26-09, `docs/plan/PLAN_EL_AISLAMIENTO.md` A1): el sobre
# no conoce a quien escribe en el. El de x86-64 vive en `bmo-bsf-x86-64`, el
# SASS de la 3060 en `bmo-gpu-ga10x`. Lo vigila `la-3060` (regla S).
[dependencies]
bmo-hash = { path = "../../../../platform/shared/bmo-hash" }
bmo-spirv-front = { path = ".." }

[lib]
name = "bmo_bsf"
path = "src/lib.rs"
