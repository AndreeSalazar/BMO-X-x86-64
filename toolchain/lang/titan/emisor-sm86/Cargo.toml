[package]
name = "bmo-titan-sm86"
version = "0.1.0"
edition = "2021"
authors = ["BMO Project"]
description = "TITAN++ para la 3060: cada `gpu fn` hecha el Programa de la casa, emitida a SM86 y juzgada por el juez del SASS. Sin SPIR-V."

# ** LA CADENA (decision del propietario, 07-10): gpu fn -> Programa -> SM86
# -> el juez -> la 3060. El MISMO emisor y el MISMO juez que usa PROTON-X:
# lo que TITAN++ (e ILLAPA) abren en la 3060, Cyberpunk lo usa sin copiarlo.
[dependencies]
bmo-titan-front = { path = ".." }
# El `Programa` de la casa y su interprete.
bmo-proton-x = { path = "../../../../platform/shared/proton-x" }
# El emisor a SM86 (E3..E6) y el simulador de la 3060.
bmo-proton-x-sm86 = { path = "../../../../platform/shared/proton-x-sm86" }
# El JUEZ del SASS: la libreria de lo que sabe la 3060 (R1..R9).
bmo-gpu-ga10x = { path = "../../../../platform/drivers/gpu/ga10x" }

[lib]
name = "bmo_titan_sm86"
path = "src/lib.rs"
