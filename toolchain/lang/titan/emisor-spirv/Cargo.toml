[package]
name = "bmo-titan-spirv"
version = "0.1.0"
edition = "2021"
authors = ["BMO Project"]
description = "TITAN++ para la 3060: cada `gpu fn` hecha un modulo SPIR-V de computo, juzgado por el juez de spirv."

# -- Por que es un CRATE APARTE (nivel 11, G2 de PLAN_EL_CENTAURO) ---
#
# TITAN_MAESTRO 7.4: el frontend y su juez no saben de maquinas, y lo que viaja
# a la GPU es un FORMATO -- SPIR-V --, no un cerebro compartido. Escribir ese
# formato es de este crate, como los bytes de x86-64 son de `emisor-x86_64`.
#
# ** Y quien lo JUZGA no es este crate: es el juez de spirv (`bmo-spirv-front`,
# el validador neutro) y el subconjunto de la 3060 (`bmo-spirv-sm86`). Lo que
# este crate escribe pasa por ellos como si viniera de fuera; si no pasa, el
# fallo es del ESCRITOR, nunca del programa.
[dependencies]
bmo-titan-front = { path = ".." }
bmo-spirv-front = { path = "../../spirv" }
bmo-spirv-sm86 = { path = "../../spirv/emisor-sm86" }

[lib]
name = "bmo_titan_spirv"
path = "src/lib.rs"
