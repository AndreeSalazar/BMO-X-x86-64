[package]
name = "bmo-bex-link"
version = "0.1.0"
edition = "2021"
description = "Convierte el ELF de un crate Ring 3 en un contenedor BEF (.bex)"

[[bin]]
name = "bex-link"
path = "src/main.rs"

[dependencies]
bmo-abi = { path = "../../../platform/abi/bmo-abi" }
# LA LENTE (B4, 14-10): lee el codigo que escribio LLVM y lo juzga contra lo
# que el propietario decidio (`PERFIL/CPU.txt`).
bmo-lente-x86 = { path = "../../../platform/shared/bmo-lente-x86" }
