[package]
name = "bmo-maqueta"
version = "0.1.0"
edition = "2021"
description = "El binario `maqueta`: compila un .maqueta a Rust. Un CONSUMIDOR de la cadena, no una generacion."
license = "Apache-2.0"

[[bin]]
name = "maqueta"
path = "src/main.rs"

[dependencies]
bmo-maqueta-node = { path = "../node" }
bmo-maqueta-cascade = { path = "../cascade" }
bmo-maqueta-layout = { path = "../layout" }
bmo-maqueta-verdict = { path = "../verdict" }
bmo-maqueta-emit = { path = "../emit" }
# Las PIEZAS (`<usa src>`): cada una compilada y juzgada sola, e injertada.
bmo-maqueta-compone = { path = "../compone" }
bmo-maqueta-diag = { path = "../diag" }
# `--foto`: la cara pintada a PNG con el escritor de la casa.
bmo-imagen = { path = "../../../../platform/shared/bmo-imagen" }
