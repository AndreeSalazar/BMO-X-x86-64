  <defs>
    <radialGradient id="planeta" cx="35%" cy="35%">
      <stop offset="0" stop-color="#F5C48E"/>
      <stop offset=".7" stop-color="#C26A3A"/>
      <stop offset="1" stop-color="#5A2410"/>
    </radialGradient>
  </defs>
  <circle r="22" fill="url(#planeta)"/>
  <ellipse rx="40" ry="9" fill="none" stroke="#F5C48E" stroke-opacity=".6" transform="rotate(-14)"/>
</svg>
