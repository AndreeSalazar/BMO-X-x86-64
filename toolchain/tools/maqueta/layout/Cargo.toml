[package]
name = "bmo-maqueta-layout"
version = "0.1.0"
edition = "2021"
description = "MAQUETA, grandson generation: box x box -> final rects. Never reads a colour and holds no opinion."
license = "Apache-2.0"

# `diag` is not here, and that is worth noticing: this generation cannot fail.
# Everything it could complain about is a judgement about a finished layout, and
# judgements belong to `verdict/`.
[dependencies]
bmo-maqueta-cascade = { path = "../cascade" }
bmo-maqueta-node = { path = "../node" }
bmo-maqueta-diag = { path = "../diag" }
# MAQUETA 3: la medida que dice el fichero de un `<svg src>`.
bmo-maqueta-dibujo = { path = "../dibujo" }
# MAQUETA 2: el texto se mide con la letra de la casa, la MISMA que lo pinta.
bmo-letra = { path = "../../../../platform/shared/bmo-letra" }
