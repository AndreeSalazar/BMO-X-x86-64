[package]
name = "bmo-maqueta-node"
version = "0.1.0"
edition = "2021"
description = "MAQUETA, father generation: tokens -> named boxes and named rules. Knows no parents, no siblings and no screen."
license = "Apache-2.0"

# Only the generation below, plus the shared error vocabulary. If a dependency
# ever appears here pointing at `cascade`, `layout` or `verdict`, the cut is
# wrong (L7a).
[dependencies]
bmo-maqueta-lex = { path = "../lex" }
bmo-maqueta-diag = { path = "../diag" }
# MAQUETA 3: lo de dentro de un `<svg>` es SVG, y lo lee SU lector.
bmo-maqueta-dibujo = { path = "../dibujo" }
