<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 20" width="90" height="30">
  <!-- Tres puntos que laten en escalera: `@keyframes` y `:nth-child`, como
       los cargadores que hay en internet (S7 de MAQUETA 3). -->
  <style>
    circle { fill: #5EF2E6; animation: late 1.2s ease-in-out infinite }
    circle:nth-child(3) { animation-delay: .4s; fill: #3DA5FF }
    circle:nth-child(4) { animation-delay: .8s; fill: #FF2E88 }
    @keyframes late { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }
  </style>
  <circle cx="10" cy="10" r="6"/>
  <circle cx="30" cy="10" r="6"/>
  <circle cx="50" cy="10" r="6"/>
</svg>
